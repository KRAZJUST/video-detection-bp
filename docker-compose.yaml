version: '3.9'

services:
  app:
    build: .
    image: your-app-image
    environment:
      - DISPLAY=${DISPLAY}
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
    volumes:
      - .:/home/devuser/app
      - /tmp/.X11-unix:/tmp/.X11-unix
    runtime: nvidia
    network_mode: "host"  # for GUI responsiveness
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]
