version: '3.8'

services:
  video-detection:
    build:
      context: .
      dockerfile: Dockerfile
    image: video-detection-app
    container_name: video-detection-app
    volumes:
      - ./src:/app/src
      - ./data:/app/data
      - ${HOME}/.Xauthority:/root/.Xauthority:ro
      - /tmp/.X11-unix:/tmp/.X11-unix
    environment:
      - DISPLAY=${DISPLAY}
      - NVIDIA_VISIBLE_DEVICES=all
      - QT_X11_NO_MITSHM=1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    # For troubleshooting
    # stdin_open: true
    # tty: true